<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹内希来里＆蔵盛妃那乃のひらがなゲッター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- ① タイトル＆説明画面                       -->
    <!-- ========================================== -->
    <div id="start-screen" class="screen">
        <div class="title-container">
            <span class="title-badge">ひらがなキャッチゲーム</span>
            <h1>竹内希来里＆蔵盛妃那乃の<br><span class="highlight-text">ひらがなゲッター</span></h1>
            <p class="subtitle">落ちてくる文字を見極めてキャッチしよう！✨</p>
        </div>

        <div class="start-btn-group">
            <button id="show-rule-btn" class="btn secondary-btn">📖 ルール説明</button>
            <button id="to-select-btn" class="btn primary-btn">🎮 メンバー選択へ</button>
        </div>
    </div>

    <!-- ルールモーダル（ポップアップ） -->
    <div id="rule-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>🎮 ルール・遊び方</h2>
            <div class="rule-body">
                <p><strong>【基本操作】</strong><br>左右に動かして落ちてくる文字をキャッチ！</p>
                <p><strong>【集める文字】</strong></p>
                <ul>
                    <li><strong>竹内希来里：</strong>「た・け・う・ち・き・ら・り」</li>
                    <li><strong>蔵盛妃那乃：</strong>「く・ら・も・り・ひ・な・の」</li>
                </ul>
                <p class="warning">⚠️ 上記以外の関係ない文字を拾うと即ゲームオーバー！</p>
            </div>
            <button id="close-rule-btn" class="btn primary-btn">とじる</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ② メンバー選択画面                         -->
    <!-- ========================================== -->
    <div id="select-screen" class="screen" style="display: none;">
        <h2>プレイするメンバーを選んでね</h2>

        <div class="member-select-group">
            <!-- 竹内希来里 -->
            <button class="member-card" onclick="chooseMember('kirari')">
                <div class="img-wrapper">
                    <img src="kirari.png" alt="竹内希来里" class="member-img">
                </div>
                <div class="member-info">
                    <span class="member-name">竹内希来里</span>
                    <span class="member-sub">「たけうちきらり」を集める</span>
                </div>
            </button>

            <!-- 蔵盛妃那乃 -->
            <button class="member-card" onclick="chooseMember('hinano')">
                <div class="img-wrapper">
                    <img src="hinano.png" alt="蔵盛妃那乃" class="member-img">
                </div>
                <div class="member-info">
                    <span class="member-name">蔵盛妃那乃</span>
                    <span class="member-sub">「くらもりひなの」を集める</span>
                </div>
            </button>
        </div>

        <button id="back-to-title-btn" class="btn text-btn">← タイトルに戻る</button>
    </div>

    <!-- ========================================== -->
    <!-- ③ ゲーム画面                               -->
    <!-- ========================================== -->
    <div id="game-screen" class="screen" style="display: none;">
        <div class="game-header">
            <div id="score-display">スコア: <span id="score">0</span></div>
            <div id="current-member-display">メンバー: <span id="playing-member">-</span></div>
        </div>

        <!-- ゲーム領域 -->
        <canvas id="gameCanvas" width="400" height="500"></canvas>

        <!-- 中断ボタン -->
        <div class="game-controls">
            <button id="pause-btn" class="btn secondary-btn small-btn">⏸ 中断する</button>
        </div>
        <p class="controls-hint">💡 矢印キー（← →）または画面のスライドで移動できます</p>
    </div>

    <!-- ========================================== -->
    <!-- ④ ゲームオーバー画面（中央モーダル）        -->
    <!-- ========================================== -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content gameover-content">
            <h2 class="gameover-title">GAME OVER</h2>
            <p class="gameover-reason">違う文字をキャッチしてしまった！</p>

            <div class="final-score-box">
                <span>最終スコア</span>
                <div class="final-score" id="final-score">0</div>
            </div>

            <div class="modal-btn-group">
                <button id="retry-btn" class="btn primary-btn">もう一度あそぶ</button>
                <button id="quit-btn" class="btn secondary-btn">タイトルへ戻る</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
